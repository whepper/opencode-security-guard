name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs escalate explicitly.
permissions:
  contents: read

jobs:
  test:
    name: tests + validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests + adversarial bypass corpus
        run: npm test
      - name: Structure / license / metadata validation
        run: node scripts/validate.mjs
      - name: Policy drift check (generated artifacts match source)
        run: node scripts/generate-config.mjs --check
      - name: Plugin syntax
        run: node --check plugin/security-guard.js
      - name: Secret scan (dependency-free)
        run: node scripts/scan-secrets.mjs

  codeql:
    name: codeql (javascript)
    runs-on: ubuntu-latest
    # Dependabot PRs get a read-only GITHUB_TOKEN that cannot upload SARIF;
    # CodeQL still runs on push to main after merge.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
