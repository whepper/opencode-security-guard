name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs escalate explicitly.
permissions:
  contents: read

jobs:
  test:
    name: tests + validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests + adversarial bypass corpus
        run: npm test
      - name: Structure / license / metadata validation
        run: node scripts/validate.mjs
      - name: Policy drift check (generated artifacts match source)
        run: node scripts/generate-config.mjs --check
      - name: Plugin syntax
        run: node --check plugin/security-guard.js
      - name: Secret scan (dependency-free)
        run: node scripts/scan-secrets.mjs

  codeql:
    name: codeql (javascript)
    runs-on: ubuntu-latest
    # Dependabot PRs get a read-only GITHUB_TOKEN that cannot upload SARIF;
    # CodeQL still runs on push to main after merge.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
